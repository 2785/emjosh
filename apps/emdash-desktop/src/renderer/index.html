<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PRODUCT_NAME%</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('emdash-theme');
          var pref = raw ? JSON.parse(raw) : null;
          var effective =
            pref === 'emlight' || pref === 'emdark'
              ? pref
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'emdark'
                : 'emlight';
          document.documentElement.classList.add(effective);
          // sRGB approximations of the theme --background / --foreground
          // tokens, applied before any stylesheet loads so the very first
          // paint (and the boot splash) match the persisted theme.
          var dark = effective === 'emdark';
          var style = document.documentElement.style;
          style.backgroundColor = dark ? '#111111' : '#fcfcfc';
          style.setProperty('--boot-splash-bg', dark ? '#111111' : '#fcfcfc');
          style.setProperty('--boot-splash-fg', dark ? '#eeeeee' : '#202020');
        } catch (_) {}
      })();
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background-color: var(--boot-splash-bg, #fcfcfc);
        color: var(--boot-splash-fg, #202020);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        user-select: none;
        cursor: default;
        opacity: 1;
        transition: opacity 180ms ease-out;
        -webkit-app-region: drag;
      }
      #boot-splash.boot-splash-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .boot-splash-logo {
        height: 48px;
        width: 48px;
      }
      #boot-splash .boot-splash-wordmark {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        opacity: 0.9;
      }
      #boot-splash .boot-splash-progress {
        position: relative;
        width: 132px;
        height: 2px;
        border-radius: 1px;
        overflow: hidden;
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 14%, transparent);
        opacity: 0;
        animation: boot-splash-reveal 240ms ease-out 1200ms forwards;
      }
      #boot-splash .boot-splash-progress::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 1px;
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 55%, transparent);
        animation: boot-splash-slide 1.3s ease-in-out infinite;
      }
      #boot-splash-escape {
        position: absolute;
        bottom: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        font-size: 13px;
        color: color-mix(in srgb, var(--boot-splash-fg, #202020) 72%, transparent);
      }
      #boot-splash-escape[hidden] {
        display: none;
      }
      #boot-splash-escape p {
        margin: 0;
      }
      .boot-splash-escape-actions {
        display: flex;
        gap: 8px;
      }
      .boot-splash-escape-actions button {
        -webkit-app-region: no-drag;
        appearance: none;
        font: inherit;
        font-size: 12px;
        color: var(--boot-splash-fg, #202020);
        background: transparent;
        border: 1px solid color-mix(in srgb, var(--boot-splash-fg, #202020) 30%, transparent);
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .boot-splash-escape-actions button:hover {
        background-color: color-mix(in srgb, var(--boot-splash-fg, #202020) 8%, transparent);
      }
      @keyframes boot-splash-reveal {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-splash-slide {
        0% {
          left: -40%;
        }
        100% {
          left: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-splash-progress {
          animation-duration: 1ms;
        }
        #boot-splash .boot-splash-progress::before {
          animation: none;
          left: 30%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <!-- splash-logo -->
      <svg class="boot-splash-logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="112" fill="#13151B" />
        <path
          d="M346 215 V290 A90 90 0 0 1 166 290"
          fill="none"
          stroke="#A5F3C2"
          stroke-width="64"
          stroke-linecap="round"
        />
        <circle cx="346" cy="138" r="34" fill="#F5F5F7" />
      </svg>
      <!-- /splash-logo -->
      <div class="boot-splash-progress"></div>
      <div id="boot-splash-escape" hidden>
        <p>%PRODUCT_NAME% is taking longer than expected to start.</p>
        <div class="boot-splash-escape-actions">
          <button id="boot-splash-restart" type="button">Restart %PRODUCT_NAME%</button>
          <button id="boot-splash-recovery" type="button">Open recovery</button>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
